<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    width: 100vw;
    height: 100vh;
  }
  #canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- VJ Schema -->
<script id="vj-schema" type="application/json">
[
  { "id": "speed", "label": "速度", "type": "range", "min": 0.1, "max": 4, "step": 0.1, "default": 1.2, "midi": "Knob1-1" },
  { "id": "trail", "label": "残像", "type": "range", "min": 0.01, "max": 0.3, "step": 0.01, "default": 0.08, "midi": "Knob2-1" },
  { "id": "kickBoost", "label": "キック強調", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.5, "midi": "Fader1-1" },
  { "id": "distort", "label": "歪み", "type": "range", "min": 0, "max": 2, "step": 0.01, "default": 0.6, "midi": "Fader2-1" },
  { "id": "mode", "label": "モード", "type": "select", "options": ["orbit", "spiral"], "default": "orbit", "midi": "Pad2" }
]
</script>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ===== 状態 =====
let params = {
  baseR: 0,
  baseG: 255,
  baseB: 255,
  baseA: 1.0,
  speed: 1.2,
  trail: 0.08,
  kickBoost: 1.5,
  distort: 0.6,
  mode: "orbit"
};

let groupColor = { r: 0, g: 0, b: 0 };
let fftData = new Uint8Array(512);

window.addEventListener("message", (e) => {
  const msg = e.data;
  if (msg.type === "param_update") params[msg.paramId] = msg.value;
  if (msg.type === "group_update") groupColor = hexToRgb(msg.color);
  if (msg.type === "audio_data") fftData = new Uint8Array(msg.fft);
});

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16) || 0,
    g: parseInt(hex.slice(3, 5), 16) || 0,
    b: parseInt(hex.slice(5, 7), 16) || 0
  };
}

// ===== FFT =====
function getKick() {
  let sum = 0;
  for (let i = 0; i < 8; i++) sum += fftData[i];
  return (sum / 8) / 255;
}
function getHigh() {
  let sum = 0;
  for (let i = 100; i < 200; i++) sum += fftData[i];
  return (sum / 100) / 255;
}

// ===== Trail用 =====
let particles = [];
const MAX = 120;

function spawn(x, y, size, color) {
  particles.push({
    x, y,
    size,
    life: 1,
    vx: (Math.random() - 0.5) * 10,
    vy: (Math.random() - 0.5) * 10,
    color
  });
  if (particles.length > MAX) particles.shift();
}

// ===== メイン =====
let t = 0;

function draw() {
  t += 0.016 * params.speed;

  const kick = getKick() * params.kickBoost;
  const high = getHigh();

  const r = (params.baseR + groupColor.r) % 256;
  const g = (params.baseG + groupColor.g) % 256;
  const b = (params.baseB + groupColor.b) % 256;

  // ===== Trail =====
  ctx.fillStyle = `rgba(0,0,0,${params.trail})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  let x, y;

  if (params.mode === "orbit") {
    const radius = 200 + kick * 300;
    x = cx + Math.cos(t * 2) * radius;
    y = cy + Math.sin(t * 2) * radius;
  } else {
    const radius = t * 20 % 400;
    x = cx + Math.cos(t * 3) * radius;
    y = cy + Math.sin(t * 3) * radius;
  }

  // ===== 歪み =====
  x += Math.sin(t * 10) * 50 * params.distort * high;
  y += Math.cos(t * 10) * 50 * params.distort * high;

  // ===== Kickで爆発 =====
  if (kick > 0.4) {
    for (let i = 0; i < 8 + kick * 20; i++) {
      spawn(x, y, 4 + kick * 10, { r, g, b });
    }
  }

  // ===== Particle描画 =====
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life *= 0.94;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${p.life})`;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
