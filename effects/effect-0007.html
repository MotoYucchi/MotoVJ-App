<!DOCTYPE html>
<html>
<head><style>body { margin: 0; overflow: hidden; background: transparent; }</style></head>
<body>
  <canvas id="canvas"></canvas>
  <script id="vj-schema" type="application/json">
    [
      { "id": "size", "label": "基本サイズ", "type": "range", "min": 10, "max": 800, "step": 1, "default": 200 },
      { "id": "thickness", "label": "基本の太さ", "type": "range", "min": 1, "max": 100, "step": 1, "default": 5 },
      { "id": "opacity", "label": "透明度", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
      { "id": "color", "label": "ベース色", "type": "color", "default": "#00ff00" },
      { "id": "reactLow", "label": "低音反応 (拡大)", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.0 }
    ]
  </script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    let params = { size: 200, thickness: 5, opacity: 1.0, color: '#00ff00', reactLow: 1.0 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    }
    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (msg.type === 'param_update') params[msg.paramId] = msg.paramId === 'color' ? msg.value : Number(msg.value);
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });
    function render() {
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(width/2, height/2);
      const s = params.size * (1 + bass * params.reactLow);
      const lRgb = hexToRgb(params.color);
      ctx.strokeStyle = `rgba(${(lRgb.r + groupColorRgb.r)%256}, ${(lRgb.g + groupColorRgb.g)%256}, ${(lRgb.b + groupColorRgb.b)%256}, ${params.opacity})`;
      ctx.lineWidth = params.thickness;
      ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.restore();
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
