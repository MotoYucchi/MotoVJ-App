<!DOCTYPE html>
<html>
<head>
  <style>body { margin: 0; overflow: hidden; background: transparent; }</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script id="vj-schema" type="application/json">
    [
      { "id": "size", "label": "基本サイズ", "type": "range", "min": 10, "max": 500, "step": 1, "default": 150 },
      { "id": "thickness", "label": "基本の太さ", "type": "range", "min": 1, "max": 50, "step": 1, "default": 5 },
      { "id": "opacity", "label": "透明度", "type": "range", "min": 0, "max": 1, "step": 0.01, "default": 1.0 },
      { "id": "color", "label": "ベース色", "type": "color", "default": "#ffff00" },
      { "id": "reactLow", "label": "低音反応 (拡大)", "type": "range", "min": 0, "max": 3, "step": 0.1, "default": 1.0 },
      { "id": "reactMid", "label": "中音反応 (色相)", "type": "range", "min": 0, "max": 360, "step": 1, "default": 90 },
      { "id": "reactHigh", "label": "高音反応 (太さ)", "type": "range", "min": 0, "max": 50, "step": 1, "default": 20 }
    ]
  </script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let params = { size: 150, thickness: 5, opacity: 1.0, color: '#ffff00', reactLow: 1.0, reactMid: 90, reactHigh: 20 };
    let currentFFT = new Array(512).fill(0);
    let groupColorRgb = { r: 0, g: 0, b: 0 };

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    }

    function calculateModColor(layerHex, gRgb, alpha) {
      const lRgb = hexToRgb(layerHex);
      const r = (lRgb.r + gRgb.r) % 256;
      const g = (lRgb.g + gRgb.g) % 256;
      const b = (lRgb.b + gRgb.b) % 256;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (msg.type === 'param_update') params[msg.paramId] = msg.paramId === 'color' ? msg.value : Number(msg.value);
      else if (msg.type === 'audio_data' && msg.fft) currentFFT = msg.fft;
      else if (msg.type === 'group_update') groupColorRgb = hexToRgb(msg.color);
    });

    function render() {
      const bass = (currentFFT[1] + currentFFT[2] + currentFFT[3]) / 3 / 255.0 || 0;
      let midSum = 0; for(let i = 20; i <= 30; i++) midSum += currentFFT[i];
      const mid = (midSum / 11) / 255.0 || 0;
      let highSum = 0; for(let i = 100; i <= 120; i++) highSum += currentFFT[i];
      const high = (highSum / 21) / 255.0 || 0;

      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(width/2, height/2);
      ctx.rotate(mid * params.reactMid * Math.PI / 180);
      
      const s = params.size * (1 + bass * params.reactLow);
      ctx.lineWidth = params.thickness + (high * params.reactHigh);
      ctx.strokeStyle = calculateModColor(params.color, groupColorRgb, params.opacity);

      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * s, Math.sin((18 + i * 72) * Math.PI / 180) * s);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (s * 0.5), Math.sin((54 + i * 72) * Math.PI / 180) * (s * 0.5));
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
