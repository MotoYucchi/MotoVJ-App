<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 200 200">
  <!-- Monitor -->
  <rect x="30" y="30" width="140" height="100" rx="10" fill="none" stroke="white" stroke-width="12"/>
  <line x1="100" y1="130" x2="100" y2="160" stroke="white" stroke-width="12"/>
  <line x1="65" y1="165" x2="135" y2="165" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <!-- Arrow out -->
  <polyline points="100,50 100,110" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <polyline points="75,85 100,110 125,85" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
